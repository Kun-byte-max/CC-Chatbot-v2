version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.6
    container_name: cc_meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey123
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data
    restart: always

volumes:
  meili_data:
